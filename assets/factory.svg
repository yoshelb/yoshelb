<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-label="Agent Board factory. An inner loop ships work from To Do through dispatch, worker, and testing agents to Ready to Merge, where a human reviews and merges. Sensors tap that loop into an append-only store. An outer loop aggregates, proposes, and scores; proposals re-enter the inner loop as ordinary cards.">
  <style>
    .ab-d text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ab-d .ink  { fill: #0b0b0b; }
    .ab-d .sec  { fill: #6f6e68; }
    .ab-d .hair { stroke: #e1e0d9; fill: none; }
    .ab-d .haveS{ stroke: #2a78d6; }
    .ab-d .haveF{ fill: #2a78d6; }
    .ab-d .todoS{ stroke: #eb6834; }
    .ab-d .todoF{ fill: #eb6834; }
    .ab-d .loopS{ stroke: #1baf7a; }
    .ab-d .loopF{ fill: #1baf7a; }
    .ab-d .boxfill { fill: #fcfcfb; }
    .ab-d .bg { fill: #ffffff; }
    .ab-d .robo { fill: #6d28d9; }
    .ab-d .roboLight { fill: #c4b5fd; }
    .ab-d .humanS { stroke: #9a988f; }
    @media (prefers-color-scheme: dark) {
      .ab-d .ink  { fill: #ffffff; }
      .ab-d .sec  { fill: #c3c2b7; }
      .ab-d .hair { stroke: #2c2c2a; }
      .ab-d .haveS{ stroke: #3987e5; }
      .ab-d .haveF{ fill: #3987e5; }
      .ab-d .todoS{ stroke: #d95926; }
      .ab-d .todoF{ fill: #d95926; }
      .ab-d .loopS{ stroke: #199e70; }
      .ab-d .loopF{ fill: #199e70; }
      .ab-d .boxfill { fill: #1a1a19; }
      .ab-d .bg { fill: #0d1117; }
      .ab-d .robo { fill: #7c3aed; }
    }
  </style>
  <defs>
    <marker id="ah-have" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="ah-todo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
    <marker id="ah-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1baf7a"/>
    </marker>
  </defs>
  <g class="ab-d">
  <rect width="900" height="650" class="bg"/>

  <!-- ============ INNER LOOP ============ -->
  <rect x="52" y="24" width="812" height="156" rx="10" class="hair" stroke-dasharray="5 4"/>
  <text class="haveF" x="68" y="46" font-size="10.5" letter-spacing="0.9" font-weight="600">INNER LOOP · SHIPS WORK · LIVE TODAY</text>

  <g class="haveS" stroke-width="1.4">
    <rect x="68"  y="60" width="124" height="72" rx="7" class="boxfill haveS"/>
    <rect x="230" y="60" width="124" height="72" rx="7" class="boxfill haveS"/>
    <rect x="392" y="60" width="124" height="72" rx="7" class="boxfill haveS"/>
    <rect x="554" y="60" width="124" height="72" rx="7" class="boxfill haveS"/>
    <rect x="716" y="60" width="124" height="72" rx="7" class="boxfill haveS"/>
  </g>

  <!-- icons: the card, the robot, the eye, the human -->
  <g>
    <rect x="117" y="72" width="26" height="20" rx="3" class="boxfill haveS" stroke-width="1.6"/>
    <rect x="121" y="77" width="12" height="3" rx="1.5" class="robo" opacity=".85"/>
    <rect x="121" y="83" width="18" height="2.5" rx="1.25" fill="#b9c6d8"/>
  </g>
  <g>
    <rect x="279" y="72" width="26" height="19" rx="6" class="robo"/>
    <circle cx="287" cy="80.5" r="2.4" class="roboLight"/>
    <circle cx="297" cy="80.5" r="2.4" class="roboLight"/>
    <rect x="289.5" y="85" width="5" height="1.8" rx="0.9" fill="#ffffff"/>
    <line x1="292" y1="72" x2="292" y2="67" stroke="#6d28d9" stroke-width="1.6"/>
    <circle cx="292" cy="65.5" r="2" class="roboLight"/>
  </g>
  <g class="haveS" fill="none" stroke-width="1.6">
    <path d="M602 82 Q616 70 630 82 Q616 94 602 82 Z" class="boxfill"/>
    <circle cx="616" cy="82" r="4" class="haveF" stroke="none"/>
  </g>
  <g class="haveS" fill="none" stroke-width="1.8">
    <circle cx="778" cy="77" r="5" class="boxfill"/>
    <path d="M768 93 Q778 83 788 93"/>
  </g>

  <g class="ink" font-size="12.5" text-anchor="middle" font-weight="600">
    <text x="130" y="116">To Do</text>
    <text x="292" y="116">dispatch</text>
    <text x="454" y="100">worker</text>
    <text x="616" y="116">testing agents</text>
    <text x="778" y="112">Ready to Merge</text>
  </g>
  <g class="sec" font-size="10" text-anchor="middle">
    <text x="454" y="115">isolated worktree</text>
    <text x="778" y="126">human reviews &amp; merges</text>
  </g>
  <g class="haveS" stroke-width="1.4" marker-end="url(#ah-have)">
    <line x1="192" y1="96" x2="226" y2="96"/>
    <line x1="354" y1="96" x2="388" y2="96"/>
    <line x1="516" y1="96" x2="550" y2="96"/>
    <line x1="678" y1="96" x2="712" y2="96"/>
  </g>
  <path d="M616 132 L616 160 L130 160 L130 136" class="haveS" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ah-have)"/>
  <text class="sec" x="373" y="155" font-size="10.5" text-anchor="middle">bounce: a review dimension failed</text>

  <!-- ============ SENSORS ============ -->
  <text class="todoF" x="68" y="222" font-size="10.5" letter-spacing="0.9" font-weight="600">SENSORS · COMING ONLINE</text>
  <g class="todoS" stroke-width="1.4" stroke-dasharray="4 3">
    <rect x="68"  y="234" width="176" height="44" rx="7" class="boxfill todoS"/>
    <rect x="264" y="234" width="176" height="44" rx="7" class="boxfill todoS"/>
    <rect x="460" y="234" width="176" height="44" rx="7" class="boxfill todoS"/>
    <rect x="656" y="234" width="184" height="44" rx="7" class="boxfill todoS"/>
  </g>
  <g class="ink" font-size="12" text-anchor="middle">
    <text x="156" y="260">event log</text>
    <text x="352" y="260">spend parser</text>
    <text x="548" y="260">verdict recorder</text>
    <text x="748" y="260">harness snapshot</text>
  </g>
  <g class="todoS" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#ah-todo)">
    <line x1="292" y1="134" x2="156" y2="230"/>
    <line x1="454" y1="134" x2="352" y2="230"/>
    <line x1="616" y1="166" x2="548" y2="230"/>
    <line x1="778" y1="134" x2="748" y2="230"/>
  </g>

  <!-- ============ STORE ============ -->
  <g class="todoS" stroke-width="1.6">
    <rect x="68" y="304" width="772" height="50" rx="8" class="boxfill todoS"/>
    <g fill="none" stroke-width="1.5">
      <ellipse cx="404" cy="318" rx="9" ry="3.6" class="boxfill"/>
      <path d="M395 318 v10 a9 3.6 0 0 0 18 0 v-10"/>
    </g>
  </g>
  <text class="ink" x="424" y="325" font-size="13" font-weight="600">STORE</text>
  <text class="sec" x="454" y="344" font-size="10.5" text-anchor="middle">append-only rows · one stream per machine</text>
  <g class="todoS" stroke-width="1.4" marker-end="url(#ah-todo)">
    <line x1="156" y1="280" x2="156" y2="300"/>
    <line x1="352" y1="280" x2="352" y2="300"/>
    <line x1="548" y1="280" x2="548" y2="300"/>
    <line x1="748" y1="280" x2="748" y2="300"/>
  </g>

  <!-- ============ OUTER LOOP ============ -->
  <rect x="52" y="382" width="812" height="140" rx="10" class="hair" stroke-dasharray="5 4"/>
  <text class="todoF" x="68" y="404" font-size="10.5" letter-spacing="0.9" font-weight="600">OUTER LOOP · STUDIES AND IMPROVES · IN PROGRESS</text>

  <g class="todoS" stroke-width="1.4" stroke-dasharray="4 3">
    <rect x="68"  y="418" width="150" height="58" rx="7" class="boxfill todoS"/>
    <rect x="248" y="418" width="150" height="58" rx="7" class="boxfill todoS"/>
    <rect x="428" y="418" width="150" height="58" rx="7" class="boxfill todoS"/>
    <rect x="640" y="418" width="200" height="58" rx="7" class="boxfill todoS"/>
  </g>
  <g class="ink" font-size="12.5" text-anchor="middle" font-weight="600">
    <text x="143" y="443">aggregate</text>
    <text x="323" y="443">propose</text>
    <text x="503" y="443">score</text>
    <text x="740" y="443">dashboard</text>
  </g>
  <g class="sec" font-size="10" text-anchor="middle">
    <text x="143" y="459">failure patterns</text>
    <text x="323" y="459">a falsifiable prediction</text>
    <text x="503" y="459">was it right?</text>
    <text x="740" y="459">read-only</text>
  </g>
  <g class="todoS" stroke-width="1.4" marker-end="url(#ah-todo)">
    <line x1="218" y1="447" x2="244" y2="447"/>
    <line x1="398" y1="447" x2="424" y2="447"/>
    <line x1="454" y1="358" x2="454" y2="382"/>
  </g>
  <path d="M503 476 L503 506 L143 506 L143 480" class="todoS" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ah-todo)"/>
  <text class="sec" x="323" y="502" font-size="10.5" text-anchor="middle">learning feeds the next round</text>

  <!-- human review -->
  <rect x="655" y="548" width="170" height="42" rx="21" class="boxfill hair" stroke-width="1.4"/>
  <g class="humanS" fill="none" stroke-width="1.8">
    <circle cx="684" cy="564" r="4.5" class="boxfill"/>
    <path d="M676 579 Q684 570 692 579"/>
  </g>
  <text class="ink" x="756" y="573" font-size="12.5" text-anchor="middle">human review</text>
  <line x1="740" y1="480" x2="740" y2="544" class="hair" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ah-todo)"/>

  <!-- the return arrow -->
  <path d="M323 476 L323 618 L26 618 L26 96 L64 96"
        class="loopS" stroke-width="2.6" fill="none" marker-end="url(#ah-loop)"/>
  <text class="loopF" x="42" y="360" font-size="11.5" font-weight="600" transform="rotate(-90 42 360)" text-anchor="middle">a proposal is just another card</text>
  <text class="loopF" x="340" y="640" font-size="11.5" font-weight="600">the loop closes: a human merges it like any other work</text>
  </g>
</svg>
